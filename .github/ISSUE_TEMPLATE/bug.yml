name: Bug report
description: A snapshot that missed something, an undo that went wrong, or something else that isn't working.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you run, what did you expect, and what happened instead? `mulligan list` and the exact message help a lot.
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: The agent
      description: Which agent and version, and whether it was set up with hooks or with `mulligan run`.
  - type: textarea
    id: files
    attributes:
      label: The files involved
      description: Describe them rather than pasting them, like "a file that's in .gitignore", "a symlink to a folder outside the project" or "a 40 MB data file". Please don't paste code or secrets.
  - type: input
    id: version
    attributes:
      label: mulligan version
      description: "`mulligan --version`"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System and git version
      description: For example "macOS 15.7, git 2.39" or "Ubuntu 24.04, git 2.43".
    validations:
      required: true
