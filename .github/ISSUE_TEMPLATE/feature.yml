name: Feature request
description: Suggest an idea, or an agent it should work with.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would it help you do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How do you picture it working?
  - type: input
    id: agent
    attributes:
      label: An agent it should support
      description: If it's about one agent, which one, and a link to how its hooks or plugins work.
